# Transformer base (Vaswani et al. 2017, Table 3).
_target_: nstudy.core.model.Transformer
vocab_size: 37000
d_model: 512
num_heads: 8
num_layers: 6
d_ff: 2048
dropout: 0.1
pad_id: 0
# false: post-norm, norm(x + sublayer(x)), as in the paper.
# true: pre-norm, x + sublayer(norm(x)), plus a final norm after each stack.
norm_first: false
norm_layer:
  _target_: torch.nn.LayerNorm
  _partial_: true
