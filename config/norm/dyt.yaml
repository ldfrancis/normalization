# @package model.norm_layer
# gamma * tanh(alpha * x) + beta (nstudy/core/norms.py). alpha: one learned number per layer.
_target_: nstudy.core.norms.DynamicTanh
_partial_: true
alpha_init: 0.5
per_channel_alpha: false
# false drops beta; a ResNet's convs then have no bias at all.
bias: true
# Dropout on the layer's output (after gamma and beta) in training; 0 for none.
dropout: 0.0
# true: drop whole channels of an image (Dropout2d) instead of single elements; ResNets only.
dropout_channels: false
